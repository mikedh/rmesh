[build-system]
# make sure we build on the same numpy version range
# as our install numpy version range
requires = ["maturin[patchelf]>=1.8,<2.0",
            "numpy>=2.0"]
build-backend = "maturin"

[project]
name = "rmesh"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
test = ["pytest", "trimesh"]
test-compat = ["pytest", "trimesh[all]"]

[tool.maturin]
manifest-path = "crates/rmesh_python/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.13",
]


[tool.pytest.ini_options]
addopts = "-p rmesh._compatibility.conftest --rmesh-compat=compare"
testpaths = ["test/trimesh/tests"]

[tool.ruff]
target-version = "py311"
line-length = 90

[tool.ruff.lint]
select = [
    "B", # bugbear
    "C", # comprehensions
    "E", # style errors
    "F", # flakes
    "I", # import sorting
    "RUF", # ruff specific rules
    "UP", # upgrade
    "W", # style warnings
    "YTT", # sys.version
    "ISC001",
    "ISC002",
    "NPY201",
    "TID251"
]
