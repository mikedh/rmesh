[package]
name = "rmesh"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
bytemuck = { workspace = true }
nalgebra = { workspace = true }
nalgebra-sparse = "0.10"
serde = { workspace = true }
starlark = { workspace = true }

ahash = "0.8.11"
nom = "7"
fast-float = "0.2"
memchr = "2"
arrayvec = "0.7"
indexmap = "2"
itertools = "0.14.0"
rayon = "1.11"
earcut = "0.4"
geometry-predicates = "0.3"
thiserror = "1.0"
i_overlay = "4"
kiddo = "5"
approx = "0.5"
image = "0.25"
flate2 = "1.0"
serde_json = "1.0"
base64 = "0.22"
rmp-serde = "1.3"
sha2 = "0.10"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.38", features = ["serialize"] }
xsd-parser-types = { version = "0.1", features = ["quick-xml", "serde"] }

# Fidget SDF backend for feature meshing (mesh + jit for fast evaluation)
fidget = { version = "0.4", default-features = false, features = ["mesh", "jit"] }
# TODO: remove when fidget re-exports nalgebra or accepts raw arrays for transforms
# Fidget uses nalgebra 0.34, we use 0.33, need this to build Matrix4 for OctreeSettings
nalgebra_034 = { package = "nalgebra", version = "0.34" }

[features]
default = []
wgpu = ["dep:wgpu", "dep:pollster"]
render = ["wgpu", "dep:log"]
bench = ["dep:pprof"]

[dependencies.wgpu]
workspace = true
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[dependencies.log]
version = "0.4"
optional = true

[dependencies.pprof]
version = "0.15"
features = ["flamegraph"]
optional = true

[dev-dependencies]
qhull = "0.4"

[build-dependencies]
quick-xml = "0.37"
convert_case = "0.7"
zstd = "0.13"
anyhow = { workspace = true }
serde_json = "1.0"
serde = { workspace = true }
shaderloom = { workspace = true }

[lints]
workspace = true
